name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger PythonAnywhere deployment
        env:
          PA_USERNAME: ${{ secrets.USERNAME }}
          PA_API_TOKEN: ${{ secrets.TOKEN }}
        run: |
          curl -X POST "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/webapps/$PA_USERNAME.pythonanywhere.com/reload/" \
          -H "Authorization: Token $PA_API_TOKEN"
